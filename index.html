<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta para mi Amada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

 <audio controls autoplay style="display: none;">
        <source src="FlowersNeedRain.mp3" type="audio/mp3">
    </audio>
    <div id="lyrics">
      
    </div>
    <script>
        // Simula la interacción del usuario al hacer clic en el documento
        document.addEventListener('click', function() {
          // Obtiene el elemento de audio y lo reproduce
          var audio = document.querySelector('audio');
          audio.play();
        });
      </script>
  
  <main>
    <div class="container-letter">
      <div class="cover"></div>
      <span class="heart">♥</span>
      <p class="paper" id="mainMessage">
        Preciosa, lamento profundamente todo lo que hice y no pensé bien en su momento. Eres una persona increíblemente importante para mí y quiero proteger tu alma y darle mucho amor 😔
      </p>
      <div class="letter"></div>
    </div>
    <div class="options">
      <button id="open">Abrir</button>
      <button id="close">Cerrar</butto>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
